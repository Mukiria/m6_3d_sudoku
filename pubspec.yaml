name: m6_sudoku
description: A production-ready Flutter Sudoku application built with Clean Architecture, Feature-first architecture, Riverpod, and GoRouter.
version: 1.0.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.0.0
  collection: ^1.18.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.1
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^2.4.4
  go_router: ^14.2.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  logger: ^2.4.0
  path: ^1.9.0
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  confetti: ^0.7.0
  url_launcher: ^6.2.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  custom_lint: ^0.6.0
  flutter_lints: ^4.0.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  # Bundled rather than fetched by google_fonts: release builds have no
  # INTERNET permission. Inter 4.1 static TTFs (SIL OFL, see
  # assets/fonts/LICENSE.txt), one file per weight the UI actually uses.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_intl:
  enabled: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/m6-sudoku-logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/m6-sudoku-logo.png"
    background_color: "#1E1E1E"
    theme_color: "#1E1E1E"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F1592B"
  image: assets/images/m6-sudoku-logo.png
  android: true
  web: true
  fullscreen: true
  android_gravity: center
  android_12:
    color: "#F1592B"
    image: assets/images/m6-sudoku-logo.png
