name: Deploy Web

# Deploys the Flutter web build to Firebase Hosting. Runs a *preview
# channel* deploy on every PR (a disposable, shareable URL — safe, doesn't
# touch production) and a *live* deploy only on push to main. Hosting config
# (rewrites, cache headers) lives in firebase.json. Until the
# FIREBASE_SERVICE_ACCOUNT secret and FIREBASE_PROJECT_ID variable exist,
# every step skips with a warning — see docs/DEPLOYMENT.md.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

# Live deploys queue rather than race, so an older build can never finish
# last and overwrite a newer one. PR previews just take the latest push.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: Build and Deploy Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase credentials
        id: fb_creds
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] || [ -z "${{ vars.FIREBASE_PROJECT_ID }}" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret and/or FIREBASE_PROJECT_ID variable not set — skipping web deploy. See docs/DEPLOYMENT.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Flutter
        if: steps.fb_creds.outputs.configured == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Get dependencies
        if: steps.fb_creds.outputs.configured == 'true'
        run: flutter pub get

      - name: Generate code
        if: steps.fb_creds.outputs.configured == 'true'
        run: dart run build_runner build --delete-conflicting-outputs

      # CanvasKit is the default (and, since Flutter 3.29, only non-wasm)
      # renderer — `--web-renderer` was removed in 3.29 and would fail here.
      - name: Build web (release)
        if: steps.fb_creds.outputs.configured == 'true'
        run: flutter build web --release

      # PR: preview channel — a temporary URL, auto-expires, never touches
      # the production site. Comments the preview link on the PR.
      - name: Deploy preview channel (pull requests)
        if: steps.fb_creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: .

      # main: live production deploy. Firebase Hosting keeps prior versions
      # and supports an instant one-click rollback in the console/CLI if a
      # deploy misbehaves — the practical "downtime" mitigation for a
      # static site (see docs/DEPLOYMENT.md, Reliability section).
      - name: Deploy to live channel (main)
        if: steps.fb_creds.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: .
          channelId: live
