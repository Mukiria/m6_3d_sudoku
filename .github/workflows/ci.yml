name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: "3.29.3"

# A newer push to the same branch/PR supersedes an in-flight run — no point
# finishing a build nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Checks committed code as-is. This used to run `dart fix --apply` and
      # `dart format .` first, which meant the check below could never fail
      # and CI tested code that differed from what was committed. Only
      # tracked files are checked: build_runner output (*.g.dart,
      # *.freezed.dart) is gitignored and isn't formatter-clean.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart')

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

      # Validates the web target compiles on every PR — previously only the
      # Android APK was built in CI, so a web-only regression (e.g. a
      # dart:io import, a plugin without web support) could land on main
      # undetected until someone ran `flutter build web` by hand.
      - name: Build release web bundle (validation only, not deployed)
        run: flutter build web --release

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
