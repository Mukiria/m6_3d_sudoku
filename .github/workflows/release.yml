name: Release

# Triggered by pushing a `v*` tag (e.g. `v1.1.0+2`, matching pubspec's
# `version:`). Produces a signed AAB/APK, cuts a GitHub Release with the
# artifacts attached, and — only if the required secrets are configured
# (see docs/DEPLOYMENT.md) — uploads the AAB to the Play Console *internal*
# testing track. Promotion from internal -> production is a deliberate
# manual step in Play Console, not automated here, so a bad build can't
# reach real users without a human looking at it first.

on:
  push:
    tags:
      - 'v*'

# Never run two releases at once, and never cancel one halfway through a
# Play Console upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag is what humans see; pubspec's `version:` is what actually
      # becomes versionName/versionCode in the binary. If they disagree, the
      # release is mislabeled — or Play rejects it for reusing a versionCode
      # — so fail before spending 20 minutes building.
      - name: Verify tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $PUBSPEC_VERSION. Tag as v$PUBSPEC_VERSION, or bump pubspec first."
            exit 1
          fi

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Flutter
        # Was pinned to 3.24.0 here while ci.yml/BuildAPK.yml use 3.29.3 —
        # aligned so the release build runs the same toolchain CI validated.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # --- Real release signing -------------------------------------------
      # android/app/build.gradle.kts falls back to the DEBUG signing config
      # whenever android/key.properties is absent — which is always true on
      # a clean CI runner. Without this step, every artifact this workflow
      # has ever produced was debug-signed and could not be uploaded to
      # Play Console (or would silently mismatch the app's real signing
      # identity). This decodes the upload keystore from a base64 secret
      # and writes key.properties so the *real* release signingConfig is
      # used instead.
      #
      # Required repo secrets (Settings -> Secrets and variables -> Actions):
      #   ANDROID_KEYSTORE_BASE64   base64 of android/app/keystore/upload-keystore.jks
      #                             (`base64 -i upload-keystore.jks | pbcopy` on macOS)
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      #
      # Secrets are passed via env and written with printf rather than
      # interpolated into an unquoted heredoc, which would shell-expand a
      # password containing `$` or a backtick into something else.
      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — falling back to debug signing. This build is NOT suitable for Play Store distribution and will be published as a pre-release. See docs/DEPLOYMENT.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols

      - name: Build release AAB
        run: >
          flutter build appbundle --release
          --obfuscate --split-debug-info=build/symbols

      # De-obfuscation symbols (needed to make Crashlytics/Play Console
      # crash stack traces readable once real minification is in effect).
      # Kept as a build artifact, not committed — each release's symbols
      # must be retrievable if a crash needs investigating later.
      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          # A debug-signed build must never look like an installable
          # production release on the Releases page.
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Play Console upload (internal testing track only) --------------
      # Requires the PLAY_SERVICE_ACCOUNT_JSON secret (a Google Play
      # Developer API service account key with Release Manager access on
      # this app). Skipped with a warning, not a failure, if absent — so
      # this workflow keeps producing GitHub Releases even before Play
      # publishing is wired up.
      - name: Check Play Console credentials
        id: play_creds
        run: |
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON secret is not set — skipping Play Console upload. See docs/DEPLOYMENT.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload AAB to Play Console (internal track)
        # Play rejects a debug-signed AAB anyway; skipping here gives a
        # clear reason instead of an opaque API error.
        if: steps.play_creds.outputs.configured == 'true' && steps.signing.outputs.signed == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # NOTE: the app has not been published yet. The Play Developer API
          # can only upload to an app that already exists in Play Console —
          # it cannot create the initial listing. Before this step can
          # succeed, create the app listing manually in Play Console under
          # this exact applicationId and complete at least one manual AAB
          # upload (store listing, content rating, data safety, etc.). See
          # docs/DEPLOYMENT.md §8.
          packageName: com.msixv.m6sudoku
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
